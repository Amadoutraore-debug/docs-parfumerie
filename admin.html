<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Espace gérante</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0c0a">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">
  <!-- Connexion -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="logo" id="loginLogo"></div>
      <h1>Espace gérante</h1>
      <p class="muted">Connectez-vous pour gérer vos produits, votre stock et vos commandes.</p>
      <div class="field"><label for="l-email">E-mail</label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Mot de passe</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
      <p class="demo-hint" id="demoHint" hidden></p>
      <button class="btn btn-dark btn-block" type="submit">Se connecter</button>
      <a href="index.html" class="back-link">← Retour à la boutique</a>
    </form>
  </section>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="logo logo-light" id="sideLogo"></div>
      <nav class="side-nav" id="sideNav">
        <button data-view="dashboard" class="active"><span data-ico="grid"></span><span>Tableau de bord</span></button>
        <button data-view="orders"><span data-ico="bag"></span><span>Commandes</span><b class="pill" id="newCount" hidden>0</b></button>
        <button data-view="products"><span data-ico="box"></span><span>Produits</span></button>
        <button data-view="promos"><span data-ico="tag"></span><span>Promos</span></button>
        <button data-view="clients"><span data-ico="users"></span><span>Clients</span></button>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank" class="side-link"><span data-ico="external"></span><span>Voir la boutique</span></a>
        <button class="side-link" id="logoutBtn"><span data-ico="logout"></span><span>Déconnexion</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Tableau de bord</h1>
          <p class="muted" id="viewSub"></p>
        </div>
        <div class="topbar-actions">
          <span class="mode-badge" id="modeBadge"></span>
          <button class="btn btn-outline btn-sm" id="notifBtn"><span data-ico="bell"></span><span>Activer les alertes</span></button>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <!-- Éditeur produit -->
  <div class="modal" id="editorModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel editor-panel" id="editorPanel"></div>
  </div>

  <!-- Confirmation -->
  <div class="modal" id="confirmModal" aria-hidden="true" role="alertdialog" aria-modal="true">
    <div class="modal-backdrop"></div>
    <div class="modal-panel confirm-panel" id="confirmPanel"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    if (window.APP_CONFIG.supabase.url) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
  </script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/logo.js"></script>
  <script src="assets/js/catalogue.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
